<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ktoonAi - AI商品图</title>
    <style>
        /* CSS Reset and Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Dark theme colors - matching original project */
            --background: 230 25% 7%;
            --foreground: 220 20% 92%;

            --card: 230 20% 12%;
            --card-foreground: 220 20% 92%;

            --popover: 230 20% 12%;
            --popover-foreground: 220 20% 92%;

            --primary: 190 100% 55%;
            --primary-foreground: 230 25% 7%;

            --secondary: 320 80% 60%;
            --secondary-foreground: 220 20% 95%;

            --muted: 230 15% 18%;
            --muted-foreground: 220 10% 55%;

            --accent: 270 60% 55%;
            --accent-foreground: 220 20% 95%;

            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;

            --border: 230 15% 20%;
            --input: 230 15% 20%;
            --ring: 190 100% 55%;

            --radius: 0.75rem;

            /* Custom colors */
            --neon-cyan: 190 100% 55%;
            --neon-pink: 320 80% 60%;
            --neon-purple: 270 60% 55%;
            --neon-blue: 220 90% 60%;

            /* Gradients */
            --gradient-hero: linear-gradient(135deg, hsl(230 25% 7%) 0%, hsl(250 30% 12%) 40%, hsl(280 25% 10%) 70%, hsl(230 25% 7%) 100%);
            --gradient-card: linear-gradient(145deg, hsl(230 20% 14%) 0%, hsl(240 18% 10%) 100%);
            --gradient-neon: linear-gradient(90deg, hsl(190 100% 55%), hsl(320 80% 60%), hsl(270 60% 55%));
            --gradient-text: linear-gradient(90deg, hsl(190 100% 65%), hsl(320 80% 65%));

            /* Shadows */
            --shadow-neon-cyan: 0 0 20px hsl(190 100% 55% / 0.3), 0 0 60px hsl(190 100% 55% / 0.1);
            --shadow-neon-pink: 0 0 20px hsl(320 80% 60% / 0.3), 0 0 60px hsl(320 80% 60% / 0.1);
            --shadow-card: 0 8px 32px hsl(0 0% 0% / 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Utility Classes */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-3 {
            gap: 0.75rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        .gap-8 {
            gap: 2rem;
        }

        .text-center {
            text-align: center;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-lg {
            font-size: 1.125rem;
        }

        .text-xl {
            font-size: 1.25rem;
        }

        .text-3xl {
            font-size: 1.875rem;
        }

        .text-5xl {
            font-size: 3rem;
        }

        .font-medium {
            font-weight: 500;
        }

        .font-semibold {
            font-weight: 600;
        }

        .font-bold {
            font-weight: 700;
        }

        .tracking-tight {
            letter-spacing: -0.025em;
        }

        .tracking-wide {
            letter-spacing: 0.025em;
        }

        .leading-relaxed {
            line-height: 1.625;
        }

        .rounded-lg {
            border-radius: var(--radius);
        }

        .rounded-xl {
            border-radius: calc(var(--radius) * 1.25);
        }

        .rounded-full {
            border-radius: 9999px;
        }

        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .px-5 {
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }

        .px-8 {
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .py-4 {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .pb-4 {
            padding-bottom: 1rem;
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .mb-8 {
            margin-bottom: 2rem;
        }

        .mb-10 {
            margin-bottom: 2.5rem;
        }

        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }

        /* Component Specific Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            border-bottom: 1px solid hsl(var(--border) / 0.5);
            background-color: hsl(var(--background) / 0.6);
            backdrop-filter: blur(12px);
        }

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 1.5rem;
            height: 1.5rem;
            fill: url(#logo-gradient);
        }

        .logo-text {
            font-family: 'Display', sans-serif;
            font-size: 1.125rem;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: none;
            align-items: center;
            gap: 2rem;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
        }

        @media (min-width: 768px) {
            .nav-links {
                display: flex;
            }
        }

        .nav-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: hsl(var(--primary));
        }

        .nav-link.active {
            color: hsl(var(--primary));
        }

        .nav-button {
            display: none;
            align-items: center;
            gap: 0.75rem;
        }

        @media (min-width: 1024px) {
            .nav-button {
                display: flex;
            }
        }

        .btn-primary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: hsl(var(--primary));
            font-family: 'Display', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: hsl(var(--primary-foreground));
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .mobile-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background: none;
            border: none;
            color: hsl(var(--foreground));
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .mobile-toggle {
                display: none;
            }
        }

        .mobile-menu {
            display: none;
            background-color: hsl(var(--background) / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(var(--border));
            padding: 1rem;
        }

        @media (max-width: 767px) {
            .mobile-menu {
                display: block;
            }
        }

        .mobile-menu a {
            display: block;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            text-decoration: none;
        }

        .mobile-menu a:hover {
            color: hsl(var(--primary));
        }

        .btn-primary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: hsl(var(--primary));
            font-family: 'Display', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: hsl(var(--primary-foreground));
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Main Content */
        .main-content {
            padding-top: 6rem;
            padding-bottom: 4rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            color: hsl(var(--muted-foreground));
            font-size: 1.125rem;
        }

        /* Layout */
        .content-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .content-layout {
                grid-template-columns: 300px 1fr;
            }
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--gradient-card);
            border-radius: var(--radius) * 1.5;
            padding: 1.5rem;
            border: 1px solid hsl(var(--border));
            height: fit-content;
            position: sticky;
            top: 6rem;
        }

        .settings-panel h2 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: hsl(var(--foreground));
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: hsl(var(--muted-foreground));
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--muted));
            color: hsl(var(--foreground));
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }

        .hidden-input {
            display: none;
        }

        /* Image Upload Area */
        .image-upload-area {
            border: 2px dashed hsl(var(--border));
            border-radius: var(--radius);
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background-color: hsl(var(--muted) / 0.3);
        }

        .image-upload-area:hover {
            border-color: hsl(var(--primary));
            background-color: hsl(var(--muted) / 0.5);
        }

        .upload-placeholder-icon {
            font-size: 2rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: 0.5rem;
        }

        .upload-placeholder-text {
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: 0.25rem;
        }

        .upload-placeholder-hint {
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
        }

        /* Image Preview */
        .image-preview-container {
            margin-top: 1rem;
        }

        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 9/16;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-single-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: hsl(var(--destructive));
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: transparent;
            border: 1px solid hsl(var(--border));
            color: hsl(var(--foreground));
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: hsl(var(--primary));
            color: hsl(var(--primary));
        }

        /* Result Section */
        .result-section {
            background: var(--gradient-card);
            border-radius: var(--radius) * 1.5;
            padding: 1.5rem;
            border: 1px solid hsl(var(--border));
        }

        /* History Select */
        .history-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--muted));
            color: hsl(var(--foreground));
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        /* Result Image */
        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        .result-placeholder {
            width: 100%;
            height: 300px;
            background-color: hsl(var(--muted));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsl(var(--muted-foreground));
        }

        /* Loading Animation */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .loading-spinner {
            width: 2rem;
            height: 2rem;
            border: 3px solid hsl(var(--muted));
            border-radius: 50%;
            border-top-color: hsl(var(--primary));
            animation: spin 1s ease-in-out infinite;
        }

        .loading-text {
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            background-color: hsl(var(--card));
            border-top: 1px solid hsl(var(--border));
            padding: 2rem 0;
            text-align: center;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        /* Back Button */
        .back-button {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: hsl(var(--muted));
            color: hsl(var(--muted-foreground));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .back-button:hover {
            background-color: hsl(var(--muted) / 0.8);
            color: hsl(var(--foreground));
        }

        /* AI润色按钮 */
        .ai-polish-btn {
            position: absolute;
            bottom: 0.5rem;
            left: 0.5rem;
            padding: 0.25rem 0.75rem;
            background-color: hsl(var(--primary) / 0.2);
            color: hsl(var(--primary));
            border: 1px solid hsl(var(--primary) / 0.3);
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ai-polish-btn:hover {
            background-color: hsl(var(--primary) / 0.3);
            border-color: hsl(var(--primary) / 0.5);
        }

        /* Image Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: auto;
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius);
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: hsl(var(--primary));
        }

        /* Secondary Navigation */
        .secondary-nav {
            background-color: hsl(var(--card));
            border-bottom: 1px solid hsl(var(--border));
            padding: 0.75rem 0;
            margin-bottom: 2rem;
        }

        .secondary-nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .secondary-nav-link {
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            text-decoration: none;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .secondary-nav-link:hover {
            color: hsl(var(--foreground));
            background-color: hsl(var(--muted));
        }

        .secondary-nav-link.active {
            color: hsl(var(--primary));
            background-color: hsl(var(--primary) / 0.1);
            border-color: hsl(var(--primary) / 0.3);
        }
    
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            background-color: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 12px hsl(var(--foreground) / 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 4px solid hsl(var(--primary)); }
        .toast-error { border-left: 4px solid hsl(var(--destructive)); }
        .toast-icon { width: 1.25rem; height: 1.25rem; }
        .toast-message { font-size: 0.875rem; color: hsl(var(--foreground)); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-modal.active { opacity: 1; visibility: visible; }
        .login-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .login-modal-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .login-modal-logo svg { width: 28px; height: 28px; }
        .login-modal-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-modal-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .login-modal-field { margin-bottom: 18px; }
        .login-modal-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-modal-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .login-modal-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .login-modal-password { position: relative; }
        .login-modal-password input { padding-right: 44px; }
        .login-modal-eye {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .login-modal-eye:hover { color: hsl(var(--foreground)); }
        .login-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-modal-submit:hover { opacity: 0.9; }
        .login-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-modal-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .login-modal-footer a:hover { opacity: 0.8; }
        .login-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .login-modal-close:hover { color: hsl(var(--foreground)); }

    
        /* Login Avatar */
        .login-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;

                <!-- Settings Panel -->
                <div class="settings-panel">
                    <h2>商品图生成设置</h2>

                    <!-- Hidden API inputs -->
                    <div class="form-group hidden-input">
                        <label for="api-url">API 地址</label>
                        <input type="text" id="api-url">
                    </div>
                    <div class="form-group hidden-input">
                        <label for="api-key">API 密钥</label>
                        <input type="password" id="api-key">
                    </div>

                    <!-- Model Selection -->
                    <div class="form-group">
                        <label for="model-select">选择模型</label>
                        <select id="model-select">
                            <option value="nano-banana-i2i">Nano-banana (图生图)</option>
                            <option value="doubao-4.0-i2i">即梦 4.0 (图生图 - 单图)</option>
                        </select>
                    </div>

                    <!-- Image Upload - Product -->
                    <div class="form-group" id="product-upload-group">
                        <label for="product-upload">上传商品图片</label>
                        <div id="product-upload-area" class="image-upload-area">
                            <div class="upload-placeholder-icon">+</div>
                            <div class="upload-placeholder-text">点击上传商品图片</div>
                            <div class="upload-placeholder-hint">支持 JPG, PNG 格式</div>
                            <input type="file" id="product-upload" accept="image/*" style="display: none;">
                        </div>
                        <div id="product-preview-container" class="image-preview-container" style="display: none;">
                            <div id="product-preview-grid" class="image-preview-grid">
                                <!-- 预览图片将在这里显示 -->
                            </div>
                        </div>
                    </div>

                    <!-- Prompt Input -->
                    <div class="form-group">
                        <label for="prompt-input">提示词</label>
                        <div style="position: relative;">
                            <textarea id="prompt-input" rows="4" placeholder="请输入生成图片的提示词..." style="padding-bottom: 2.5rem;"></textarea>
                            <button id="ai-polish-btn" class="ai-polish-btn" type="button">AI润色</button>
                        </div>
                    </div>

                    <!-- Aspect Ratio -->
                    <div class="form-group" id="aspect-ratio-group">
                        <label for="aspect-ratio">画面比例</label>
                        <select id="aspect-ratio">
                            <option value="1:1">1:1 (正方形)</option>
                            <option value="16:9">16:9 (横屏)</option>
                            <option value="9:16" selected>9:16 (竖屏)</option>
                            <option value="4:3">4:3 (传统)</option>
                        </select>
                    </div>

                    <!-- Action Buttons -->

                        <button id="cancel-btn" class="btn-secondary" style="display: none;">取消</button>
                        <button id="clear-btn" class="btn-secondary">清空</button>
                    </div>
                </div>

                        </select>
                    </div>

                    <!-- Result Container -->
                    <div id="result-container" class="result-display">
                        <div id="loading" class="loading hidden">

                            <p class="loading-text">正在生成图片...</p>
                        </div>
                        <div id="result-image" class="result-image hidden">

                            <div class="image-actions">

                                <button id="copy-url-btn" class="btn-secondary">复制 URL</button>
                            </div>
                        </div>
                        <div id="error-message" class="error-message hidden"></div>
                        <div id="result-placeholder" class="result-placeholder">
                            <p>生成的图片将在这里显示</p>
                        </div>
                    </div>

                <span class="login-modal-logo-text">Ktoonai</span>
            </div>
            <div class="login-modal-title">欢迎登录Ktoonai</div>
            <div class="login-modal-field">
                <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="login-modal-field login-modal-password">
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                <button class="login-modal-eye" id="loginEyeToggle" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button class="login-modal-submit" id="loginSubmit">登录</button>
            <div class="login-modal-footer">
                <a href="../converted-site/forgot-password.html">忘记密码?</a>
                <a href="../converted-site/register.html">没有账号?</a>
            </div>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toast notification system
        function showToast(message, type) {
            type = type || 'success';
            var container = document.querySelector('.toast-container') || createToastContainer();
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icon = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            toast.innerHTML = icon + '<span class="toast-message">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        function createToastContainer() {
            var container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // Login modal
        var loginModal = document.getElementById('loginModal');
        if (!loginModal) return;

        var loginModalClose = document.getElementById('loginModalClose');
        var loginEyeToggle = document.getElementById('loginEyeToggle');
        var loginPassword = document.getElementById('loginPassword');
        var loginSubmit = document.getElementById('loginSubmit');

        function openLoginModal(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            loginModal.classList.add('active');
        }

        function closeLoginModal() {
            loginModal.classList.remove('active');
        }

        // Open modal on login button click
        document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
            if (btn.textContent.trim() === '登录' && btn.id !== 'loginSubmit') {
                btn.addEventListener('click', openLoginModal);
            }
        });

        loginModalClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeLoginModal();
        });

        // Password eye toggle
        loginEyeToggle.addEventListener('click', function() {
            var isPassword = loginPassword.type === 'password';
            loginPassword.type = isPassword ? 'text' : 'password';
            loginEyeToggle.innerHTML = isPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        // Login submit
        loginSubmit.addEventListener('click', function() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = loginPassword.value.trim();
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }

            var validUsers = { '情绪过度老师': '12345678' };
            var stored = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            stored.forEach(function(u) { validUsers[u.username] = u.password; });

            if (validUsers[username] && validUsers[username] === password) {
                localStorage.setItem('ktoon_logged_in', username);
                if (window.KtoonPoints) KtoonPoints.init(username);
                showToast('登录成功！', 'success');
                closeLoginModal();
                updateLoginUI();
            } else {
                showToast('用户名或密码错误', 'error');
            }
        });

        // Update login button UI
        function updateLoginUI() {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
                var currentUser = null;
                if (loggedIn) {
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].username === loggedIn) { currentUser = users[i]; break; }
                    }
                }
                document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
                    if ((btn.textContent.trim() === '\u767b\u5f55' || btn.dataset.loggedIn === 'true') && btn.id !== 'loginSubmit') {
                        if (loggedIn) {
                            var avatarSrc = null;
                            if (loggedIn === '\u60c5\u7eea\u8fc7\u5ea6\u8001\u5e08') {
                                avatarSrc = 'yangpian/主用户/主用户头像.png';
                            } else if (currentUser && currentUser.avatar) {
                                avatarSrc = currentUser.avatar;
                            }
                            if (avatarSrc) {
                                btn.innerHTML = '<img class="login-avatar" src="' + avatarSrc + '" alt="avatar">';
                            } else {
                                btn.innerHTML = '<span class="login-avatar-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>';
                            }
                            btn.dataset.loggedIn = 'true';
                            btn.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = '../converted-site/my-profile.html';
                        };
                        } else {
                            btn.textContent = '\u767b\u5f55';
                            delete btn.dataset.loggedIn;
                        }
                    }
                });

            }
        updateLoginUI();
    });
    </script>
