<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分充值 - KToonAI</title>
    <style>
        :root {
            --bg: 230 15% 7%;
            --bg-card: 230 15% 11%;
            --bg-card-hover: 230 15% 14%;
            --border: 230 15% 18%;
            --foreground: 0 0% 90%;
            --muted-foreground: 220 10% 55%;
            --primary: 190 100% 55%;
            --accent: 270 60% 55%;
            --destructive: 0 70% 55%;
            --radius: 0.75rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: hsl(var(--bg));
            color: hsl(var(--foreground));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .recharge-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .recharge-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .recharge-header h1 .icon {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            vertical-align: middle;
            margin-right: 0.4rem;
            color: hsl(var(--primary));
        }

        .recharge-header p {
            color: hsl(var(--muted-foreground));
            font-size: 0.9rem;
        }

        .current-points {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, hsl(var(--primary) / 0.12), hsl(var(--accent) / 0.12));
            border: 1px solid hsl(var(--primary) / 0.25);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .current-points .label { color: hsl(var(--muted-foreground)); }
        .current-points .value { font-weight: 700; color: hsl(var(--primary)); font-size: 1.1rem; }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 960px;
            width: 100%;
        }

        .package-card {
            background: hsl(var(--bg-card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .package-card:hover {
            background: hsl(var(--bg-card-hover));
            border-color: hsl(var(--primary) / 0.4);
            transform: translateY(-2px);
        }

        .package-card.popular {
            border-color: hsl(var(--primary) / 0.5);
        }

        .package-card.popular::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, hsl(var(--primary)), hsl(var(--accent)));
        }

        .package-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: hsl(var(--accent) / 0.15);
            color: hsl(var(--accent));
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            border: 1px solid hsl(var(--accent) / 0.3);
        }

        .package-points {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
        }

        .package-points .fire-icon {
            width: 1.3rem;
            height: 1.3rem;
            color: hsl(var(--primary));
        }

        .package-points .amount {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .package-bonus {
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: auto;
            min-height: 1.2rem;
        }

        .package-bonus .highlight {
            color: hsl(var(--accent));
            font-weight: 600;
        }

        .package-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid hsl(var(--border));
        }

        .package-price {
            font-size: 1rem;
            font-weight: 600;
        }

        .package-price .currency { font-size: 0.8rem; opacity: 0.7; }

        .buy-btn {
            background: transparent;
            color: hsl(var(--foreground));
            border: 1px solid hsl(var(--border));
            border-radius: 0.5rem;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .buy-btn:hover {
            background: hsl(var(--primary) / 0.15);
            border-color: hsl(var(--primary) / 0.5);
            color: hsl(var(--primary));
        }

        /* Payment Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: hsl(var(--bg-card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            width: 420px;
            max-width: 95vw;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer;
            font-size: 1.2rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: all 0.15s;
        }

        .modal-close:hover { background: hsl(var(--border)); color: hsl(var(--foreground)); }

        .modal h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .modal .order-info {
            color: hsl(var(--muted-foreground));
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .modal .order-info .amount { color: hsl(var(--primary)); font-weight: 600; }

        .pay-methods {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .pay-method {
            flex: 1;
            background: hsl(var(--bg));
            border: 2px solid hsl(var(--border));
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pay-method.selected {
            border-color: hsl(var(--primary));
            background: hsl(var(--primary) / 0.08);
        }

        .pay-method:hover { border-color: hsl(var(--primary) / 0.5); }

        .pay-method .pay-icon {
            width: 2rem;
            height: 2rem;
            margin: 0 auto 0.4rem;
        }

        .pay-method .pay-label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .qr-section {
            text-align: center;
            padding: 1.5rem 0;
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            margin: 0 auto 1rem;
            background: hsl(var(--bg));
            border: 1px solid hsl(var(--border));
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .qr-placeholder .qr-icon {
            width: 3rem;
            height: 3rem;
            color: hsl(var(--muted-foreground));
        }

        .qr-placeholder .qr-text {
            font-size: 0.8rem;
            color: hsl(var(--muted-foreground));
        }

        .qr-tip {
            font-size: 0.8rem;
            color: hsl(var(--muted-foreground));
        }

        .qr-tip .highlight { color: hsl(var(--primary)); font-weight: 500; }

        .modal .order-amount {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: hsl(var(--primary));
            margin-bottom: 0.2rem;
        }

        .modal .order-amount .currency { font-size: 0.9rem; }

        .modal .order-points {
            text-align: center;
            font-size: 0.8rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .packages-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .packages-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    function renderPackages() {
        var grid = document.getElementById('packagesGrid');
        var html = '';
        PACKAGES.forEach(function(pkg, i) {
            var base = pkg.points - pkg.bonus;
            html += '<div class="package-card' + (pkg.popular ? ' popular' : '') + '" onclick="openPayment(' + i + ')">';
            if (pkg.popular) {
                html += '<span class="package-badge">限时特惠</span>';
            }
            html += '<div class="package-points">' + fireSvg + '<span class="amount">' + pkg.points.toLocaleString() + '</span></div>';
            html += '<div class="package-bonus">';
            if (pkg.bonus > 0) {
                html += '合计：' + base.toLocaleString() + ' + <span class="highlight">' + pkg.bonus.toLocaleString() + '加赠</span>';
            }
            html += '</div>';
            html += '<div class="package-bottom">';
            html += '<span class="package-price"><span class="currency">¥</span> ' + pkg.price.toLocaleString() + '</span>';
            html += '<button class="buy-btn" onclick="event.stopPropagation(); openPayment(' + i + ')">立即购买</button>';
            html += '</div>';
            html += '</div>';
        });
        grid.innerHTML = html;
    }
