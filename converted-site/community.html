<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ktoonAi - 社区</title>
    <style>
        /* CSS Reset and Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Dark theme colors - matching original project */
            --background: 230 25% 7%;
            --foreground: 220 20% 92%;

            --card: 230 20% 12%;
            --card-foreground: 220 20% 92%;

            --popover: 230 20% 12%;
            --popover-foreground: 220 20% 92%;

            --primary: 190 100% 55%;
            --primary-foreground: 230 25% 7%;

            --secondary: 320 80% 60%;
            --secondary-foreground: 220 20% 95%;

            --muted: 230 15% 18%;
            --muted-foreground: 220 10% 55%;

            --accent: 270 60% 55%;
            --accent-foreground: 220 20% 95%;

            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;

            --border: 230 15% 20%;
            --input: 230 15% 20%;
            --ring: 190 100% 55%;

            --radius: 0.75rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Utility Classes */
        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .hidden {
            display: none !important;
        }

        /* Navbar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            border-bottom: 1px solid hsl(var(--border) / 0.5);
            background-color: hsl(var(--background) / 0.6);
            backdrop-filter: blur(12px);
        }

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 1.5rem;
            height: 1.5rem;
            fill: url(#logo-gradient);
        }

        .logo-text {
            font-family: 'Display', sans-serif;
            font-size: 1.125rem;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: none;
            align-items: center;
            gap: 2rem;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
        }

        @media (min-width: 768px) {
            .nav-links {
                display: flex;
            }
        }

        .nav-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: hsl(var(--primary));
        }

        .nav-link.active {
            color: hsl(var(--primary));
        }

        .nav-button {
            display: none;
            align-items: center;
            gap: 0.75rem;
        }

        @media (min-width: 1024px) {
            .nav-button {
                display: flex;
            }
        }

        .btn-primary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: hsl(var(--primary));
            font-family: 'Display', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: hsl(var(--primary-foreground));
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .mobile-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background: none;
            border: none;
            color: hsl(var(--foreground));
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .mobile-toggle {
                display: none;
            }
        }

        .mobile-menu {
            display: none;
            background-color: hsl(var(--background) / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(var(--border));
            padding: 1rem;
        }

        @media (max-width: 767px) {
            .mobile-menu {
                display: block;
            }
        }

        .mobile-menu a {
            display: block;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            text-decoration: none;
        }

        .mobile-menu a:hover {
            color: hsl(var(--primary));
        }

        .btn-primary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: hsl(var(--primary));
            font-family: 'Display', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: hsl(var(--primary-foreground));
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Main Content */
        .main-content {
            padding-top: 6rem;
            padding-bottom: 4rem;
        }

        /* Community Gallery - 瀑布流布局 */
        .community-gallery {
            column-count: 6;
            column-gap: 0.75rem;
            padding: 1rem 0;
        }

        @media (max-width: 1400px) {
            .community-gallery {
                column-count: 5;
            }
        }

        @media (max-width: 1200px) {
            .community-gallery {
                column-count: 4;
            }
        }

        @media (max-width: 900px) {
            .community-gallery {
                column-count: 3;
            }
        }

        @media (max-width: 600px) {
            .community-gallery {
                column-count: 2;
            }
        }

        /* Work Card */
        .work-card {
            background: var(--gradient-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid hsl(var(--border));
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            break-inside: avoid;
            margin-bottom: 0.75rem;
        }

        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px hsl(0 0% 0% / 0.3);
        }

        .work-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Work Info Overlay */
        .work-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .work-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 2;
            background: hsl(var(--card));
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            max-width: 24px;
            max-height: 24px;
        }

        .work-title {
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 1.5rem;
        }

        /* Modal Styles - 即梦风格左右分栏 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 90%;
            max-width: 1100px;
            max-height: 85vh;
            overflow: hidden;
            position: relative;
            border: 1px solid hsl(var(--border));
            display: flex;
        }

        /* 左侧图片区域 */
        .modal-image-wrap {
            flex: 1 1 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: hsl(230 20% 8%);
            overflow: hidden;
            min-height: 400px;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        /* 右侧信息面板 */
        .modal-info {
            flex: 1 1 40%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid hsl(var(--border));
        }

        /* 作者栏 */
        .modal-author-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 50px 16px 20px;
            border-bottom: 1px solid hsl(var(--border));
            flex-shrink: 0;
        }

        .modal-author-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
        }

        .modal-author-name {
            font-size: 14px;
            font-weight: 600;
            color: hsl(var(--foreground));
        }

        /* 关注按钮 */
        .follow-btn {
            margin-left: auto;
            padding: 4px 16px;
            border-radius: 16px;
            border: 1px solid hsl(var(--primary));
            background: transparent;
            color: hsl(var(--primary));
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .follow-btn:hover { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
        .follow-btn.followed {
            background: hsl(var(--muted));
            border-color: hsl(var(--border));
            color: hsl(var(--muted-foreground));
        }
        .follow-btn.followed:hover { background: hsl(var(--destructive) / 0.1); border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); }

        /* 作品标题 */
        .modal-title-bar {
            padding: 16px 20px 8px;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: hsl(var(--foreground));
            margin: 0;
        }

        /* 中间可滚动区域 */
        .modal-middle {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* 提示词区域 */
        .modal-prompt-section {
            flex-shrink: 0;
            padding: 8px 20px 20px;
        }

        .modal-prompt-label {
            font-size: 12px;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-prompt-text {
            font-size: 13px;
            line-height: 1.8;
            color: hsl(var(--foreground) / 0.85);
            word-break: break-all;
        }

        .modal-prompt-text::-webkit-scrollbar {
            width: 4px;
        }

        .modal-prompt-text::-webkit-scrollbar-thumb {
            background: hsl(var(--muted-foreground) / 0.3);
            border-radius: 2px;
        }

        /* 底部操作栏 */
        .modal-action-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            border-top: 1px solid hsl(var(--border));
            flex-shrink: 0;
        }

        .modal-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: hsl(var(--muted-foreground));
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .modal-action-btn:hover {
            color: hsl(var(--foreground));
            background: hsl(var(--muted));
        }

        .modal-action-btn.liked {
            color: #ff4757;
        }

        .modal-action-btn.liked svg {
            fill: #ff4757;
            stroke: #ff4757;
        }

        /* 评论区域 */
        .modal-comment-section {
            border-top: 1px solid hsl(var(--border));
            flex-shrink: 0;
        }

        .modal-comment-header {
            font-size: 12px;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
            padding: 12px 20px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-comment-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 0 20px;
        }

        .modal-comment-list::-webkit-scrollbar { width: 4px; }
        .modal-comment-list::-webkit-scrollbar-thumb {
            background: hsl(var(--border));
            border-radius: 2px;
        }

        .modal-comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid hsl(var(--border) / 0.5);
        }

        .modal-comment-item:last-child { border-bottom: none; }

        .modal-comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .modal-comment-body { flex: 1; min-width: 0; }

        .modal-comment-username {
            font-size: 12px;
            font-weight: 600;
            color: hsl(var(--foreground));
            margin-bottom: 2px;
        }

        .modal-comment-text {
            font-size: 13px;
            line-height: 1.5;
            color: hsl(var(--foreground) / 0.8);
            word-break: break-all;
        }

        .modal-comment-time {
            font-size: 11px;
            color: hsl(var(--muted-foreground));
            margin-top: 3px;
        }

        /* 评论输入 */
        .modal-comment-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-top: 1px solid hsl(var(--border));
        }

        .modal-comment-input-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .modal-comment-input {
            flex: 1;
            background: hsl(var(--muted));
            border: 1px solid hsl(var(--border));
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: hsl(var(--foreground));
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-comment-input:focus { border-color: hsl(var(--primary)); }
        .modal-comment-input::placeholder { color: hsl(var(--muted-foreground)); }

        .modal-comment-send {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            border: none;
            border-radius: 16px;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .modal-comment-send:hover { opacity: 0.85; }

        .modal-comment-login-hint {
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
            color: hsl(var(--muted-foreground));
            border-top: 1px solid hsl(var(--border));
        }

        .modal-comment-login-hint a {
            color: hsl(var(--primary));
            text-decoration: none;
        }

        .modal-action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 关闭按钮 */
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: hsl(var(--background) / 0.7);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 8px;
            color: hsl(var(--foreground));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            background: hsl(var(--background));
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                width: 95%;
                max-height: 90vh;
            }

            .modal-image-wrap {
                flex: none;
                max-height: 50vh;
                min-height: 200px;
            }

            .modal-info {
                border-left: none;
                border-top: 1px solid hsl(var(--border));
            }

            .modal-comment-list { max-height: 150px; }
        }

        /* Footer */
        .footer {
            background-color: hsl(var(--card));
            border-top: 1px solid hsl(var(--border));
            padding: 2rem 0;
            text-align: center;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }
    
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            background-color: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 12px hsl(var(--foreground) / 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 4px solid hsl(var(--primary)); }
        .toast-error { border-left: 4px solid hsl(var(--destructive)); }
        .toast-icon { width: 1.25rem; height: 1.25rem; }
        .toast-message { font-size: 0.875rem; color: hsl(var(--foreground)); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-modal.active { opacity: 1; visibility: visible; }
        .login-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .login-modal-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .login-modal-logo svg { width: 28px; height: 28px; }
        .login-modal-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-modal-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .login-modal-field { margin-bottom: 18px; }
        .login-modal-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-modal-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .login-modal-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .login-modal-password { position: relative; }
        .login-modal-password input { padding-right: 44px; }
        .login-modal-eye {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .login-modal-eye:hover { color: hsl(var(--foreground)); }
        .login-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-modal-submit:hover { opacity: 0.9; }
        .login-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-modal-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .login-modal-footer a:hover { opacity: 0.8; }
        .login-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .login-modal-close:hover { color: hsl(var(--foreground)); }

    
        /* Login Avatar */
        .login-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .login-avatar:hover { transform: scale(1.08); }

    
        /* 登录后头像按钮去掉方框 */
        .btn-primary[data-logged-in="true"] {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .btn-primary[data-logged-in="true"]:hover {
            transform: scale(1.08);
        }
    
        .login-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: hsl(var(--muted));
            border: 1px solid hsl(var(--border));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-avatar-placeholder:hover { transform: scale(1.08); }
        .login-avatar-placeholder svg {
            width: 18px;
            height: 18px;
            color: hsl(var(--muted-foreground));
        }

        /* 确认弹窗 */
        .confirm-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.5); display: flex;

        // 工具函数
        function getCurrentUser() {
            var loggedIn = localStorage.getItem('ktoon_logged_in');
            if (!loggedIn) return null;
            if (loggedIn === '情绪过度老师') {
                return { username: '情绪过度老师', avatar: '../ai-image-tool/yangpian/主用户/主用户头像.png' };
            }
            var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            for (var i = 0; i < users.length; i++) {
                if (users[i].username === loggedIn) return users[i];
            }
            return null;
        }

        function getLikesData() {
            return JSON.parse(localStorage.getItem('ktoon_likes') || '{"userLikes":{},"likeCounts":{}}');
        }
        function saveLikesData(data) {
            localStorage.setItem('ktoon_likes', JSON.stringify(data));
        }
        function getLikeCount(workId) {
            var data = getLikesData();
            return data.likeCounts[String(workId)];
        }
        function isLikedByUser(workId, username) {
            if (!username) return false;
            var data = getLikesData();
            var userLikes = data.userLikes[username] || [];
            return userLikes.indexOf(String(workId)) !== -1;
        }
        function toggleLike(workId, username) {
            var data = getLikesData();
            var sId = String(workId);
            if (!data.userLikes[username]) data.userLikes[username] = [];
            var idx = data.userLikes[username].indexOf(sId);
            if (idx === -1) {
                data.userLikes[username].push(sId);
                data.likeCounts[sId] = (data.likeCounts[sId] || 0) + 1;
                saveLikesData(data);
                return true;
            } else {
                data.userLikes[username].splice(idx, 1);
                data.likeCounts[sId] = Math.max(0, (data.likeCounts[sId] || 1) - 1);
                saveLikesData(data);
                return false;
            }
        }

        function getComments(workId) {
            var all = JSON.parse(localStorage.getItem('ktoon_comments') || '{}');
            return all[String(workId)] || [];
        }
        function saveComment(workId, comment) {
            var all = JSON.parse(localStorage.getItem('ktoon_comments') || '{}');
            var sId = String(workId);
            if (!all[sId]) all[sId] = [];
            all[sId].push(comment);
            localStorage.setItem('ktoon_comments', JSON.stringify(all));
        }
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTimeAgo(ts) {
            var diff = Date.now() - ts;
            var mins = Math.floor(diff / 60000);
            if (mins < 1) return '刚刚';
            if (mins < 60) return mins + '分钟前';
            var hours = Math.floor(mins / 60);
            if (hours < 24) return hours + '小时前';
            var days = Math.floor(hours / 24);
            if (days < 30) return days + '天前';
            return new Date(ts).toLocaleDateString('zh-CN');
        }
        function renderComments(workId) {
            var comments = getComments(workId);
            var list = document.getElementById('commentList');
            var countEl = document.getElementById('commentCount');
            if (!list) return;
            countEl.textContent = comments.length;
            list.innerHTML = '';
            if (comments.length === 0) {
                list.innerHTML = '<div style="padding:16px 0;text-align:center;font-size:12px;color:hsl(var(--muted-foreground));">暂无评论，来抢沙发吧</div>';
                return;
            }
            comments.forEach(function(c) {
                var item = document.createElement('div');
                item.className = 'modal-comment-item';
                item.innerHTML = '<img class="modal-comment-avatar" src="' + (c.avatar || '') + '" alt="">' +
                    '<div class="modal-comment-body">' +
                    '<div class="modal-comment-username">' + escapeHtml(c.username) + '</div>' +
                    '<div class="modal-comment-text">' + escapeHtml(c.text) + '</div>' +
                    '<div class="modal-comment-time">' + formatTimeAgo(c.timestamp) + '</div>' +
                    '</div>';
                list.appendChild(item);
            });
            list.scrollTop = list.scrollHeight;
        }
        function setupCommentInput(workId) {
            var user = getCurrentUser();
            var inputWrap = document.getElementById('commentInputWrap');
            var loginHint = document.getElementById('commentLoginHint');
            var avatarEl = document.getElementById('commentAvatar');
            var inputEl = document.getElementById('commentInput');
            var sendBtn = document.getElementById('commentSendBtn');
            if (user) {
                inputWrap.style.display = 'flex';
                loginHint.style.display = 'none';
                avatarEl.src = user.avatar || '';
                inputEl.value = '';
                var newSendBtn = sendBtn.cloneNode(true);
                sendBtn.parentNode.replaceChild(newSendBtn, sendBtn);
                newSendBtn.addEventListener('click', function() {
                    var text = inputEl.value.trim();
                    if (!text) return;
                    var comment = {
                        id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        username: user.username,
                        avatar: user.avatar || '',
                        text: text,
                        timestamp: Date.now()
                    };
                    saveComment(workId, comment);
                    renderComments(workId);
                    inputEl.value = '';
                });
                inputEl.onkeydown = function(e) {
                    if (e.key === 'Enter') newSendBtn.click();
                };
            } else {
                inputWrap.style.display = 'none';
                loginHint.style.display = 'block';
                document.getElementById('commentLoginLink').onclick = function(e) {
                    e.preventDefault();
                    document.getElementById('loginModal').classList.add('active');
                };
            }
        }

        function getFollows() {
            return JSON.parse(localStorage.getItem('ktoon_follows') || '{}');
        }
        function saveFollows(data) { localStorage.setItem('ktoon_follows', JSON.stringify(data)); }
        function isFollowing(targetUsername) {
            var user = getCurrentUser();
            if (!user) return false;
            var follows = getFollows();
            return (follows[user.username] || []).indexOf(targetUsername) !== -1;
        }
        function toggleFollow(targetUsername) {
            var user = getCurrentUser();
            if (!user) return false;
            var follows = getFollows();
            if (!follows[user.username]) follows[user.username] = [];
            var idx = follows[user.username].indexOf(targetUsername);
            if (idx === -1) {
                follows[user.username].push(targetUsername);
                saveFollows(follows);
                return true;
            } else {
                follows[user.username].splice(idx, 1);
                saveFollows(follows);
                return false;
            }
        }
        function updateFollowBtn(authorName) {
            var btn = document.getElementById('modalFollowBtn');
            var user = getCurrentUser();
            if (!user || !authorName || authorName === user.username) {
                btn.style.display = 'none';
                return;
            }
            btn.style.display = '';
            if (isFollowing(authorName)) {
                btn.textContent = '已关注';
                btn.classList.add('followed');
            } else {
                btn.textContent = '关注';
                btn.classList.remove('followed');
            }
        }
        document.getElementById('modalFollowBtn').addEventListener('click', function() {
            var user = getCurrentUser();
            if (!user) { document.getElementById('loginModal').classList.add('active'); return; }
            var authorName = document.getElementById('modalUsername').textContent;
            if (!authorName || authorName === user.username) return;
            if (isFollowing(authorName)) {
                // 取消关注前确认
                document.getElementById('unfollowConfirm').style.display = 'flex';
                document.getElementById('unfollowOk').onclick = function() {
                    toggleFollow(authorName);
                    updateFollowBtn(authorName);
                    document.getElementById('unfollowConfirm').style.display = 'none';
                };
                document.getElementById('unfollowCancel').onclick = function() {
                    document.getElementById('unfollowConfirm').style.display = 'none';
                };
            } else {
                toggleFollow(authorName);
                updateFollowBtn(authorName);
            }
        });

        function loadUserPublishedWorks() {
            const published = JSON.parse(localStorage.getItem('ktoon_published_works') || '[]');
            if (published.length === 0) return;
            const gallery = document.getElementById('communityGallery');
            if (!gallery) return;
            const fragment = document.createDocumentFragment();
            published.forEach(work => {
                const card = document.createElement('div');
                card.className = 'work-card';
                const avatarSrc = work.avatar || '../ai-image-tool/yangpian/head/user1.png';
                const workId = work.id || ('pub_' + work.timestamp);
                var likeCount = getLikeCount(workId);
                if (likeCount === undefined) {
                    likeCount = Math.floor(100 + (Math.sin(workId * 127.1 + 311.7) * 0.5 + 0.5) * 29900);
                    var ld = getLikesData();
                    ld.likeCounts[String(workId)] = likeCount;
                    saveLikesData(ld);
                }
                card.innerHTML =
                    '<img src="' + work.image + '" alt="' + work.title + '">' +
                    '<img src="' + avatarSrc + '" alt="' + work.username + '" class="work-avatar" style="width:24px!important;height:24px!important;max-width:24px!important;max-height:24px!important;">' +
                    '<div class="work-info">' +
                        '<div class="work-title">' + work.title + '</div>' +

                        '</div>' +
                    '</div>';
                card.addEventListener('click', function() {

                <span class="login-modal-logo-text">Ktoonai</span>
            </div>
            <div class="login-modal-title">欢迎登录Ktoonai</div>
            <div class="login-modal-field">
                <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="login-modal-field login-modal-password">
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                <button class="login-modal-eye" id="loginEyeToggle" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button class="login-modal-submit" id="loginSubmit">登录</button>
            <div class="login-modal-footer">
                <a href="forgot-password.html">忘记密码?</a>
                <a href="register.html">没有账号?</a>
            </div>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toast notification system
        function showToast(message, type) {
            type = type || 'success';
            var container = document.querySelector('.toast-container') || createToastContainer();
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icon = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            toast.innerHTML = icon + '<span class="toast-message">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        function createToastContainer() {
            var container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // Login modal
        var loginModal = document.getElementById('loginModal');
        if (!loginModal) return;

        var loginModalClose = document.getElementById('loginModalClose');
        var loginEyeToggle = document.getElementById('loginEyeToggle');
        var loginPassword = document.getElementById('loginPassword');
        var loginSubmit = document.getElementById('loginSubmit');

        function openLoginModal(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            loginModal.classList.add('active');
        }

        function closeLoginModal() {
            loginModal.classList.remove('active');
        }

        // Open modal on login button click
        document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
            if (btn.textContent.trim() === '登录' && btn.id !== 'loginSubmit') {
                btn.addEventListener('click', openLoginModal);
            }
        });

        loginModalClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeLoginModal();
        });

        // Password eye toggle
        loginEyeToggle.addEventListener('click', function() {
            var isPassword = loginPassword.type === 'password';
            loginPassword.type = isPassword ? 'text' : 'password';
            loginEyeToggle.innerHTML = isPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        // Login submit
        loginSubmit.addEventListener('click', function() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = loginPassword.value.trim();
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }

            var validUsers = { '情绪过度老师': '12345678' };
            var stored = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            stored.forEach(function(u) { validUsers[u.username] = u.password; });

            if (validUsers[username] && validUsers[username] === password) {
                localStorage.setItem('ktoon_logged_in', username);
                showToast('登录成功！', 'success');
                closeLoginModal();
                updateLoginUI();
            } else {
                showToast('用户名或密码错误', 'error');
            }
        });

        // Update login button UI
        function updateLoginUI() {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
                var currentUser = null;
                if (loggedIn) {
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].username === loggedIn) { currentUser = users[i]; break; }
                    }
                }
                document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
                    if ((btn.textContent.trim() === '\u767b\u5f55' || btn.dataset.loggedIn === 'true') && btn.id !== 'loginSubmit') {
                        if (loggedIn) {
                            var avatarSrc = null;
                            if (loggedIn === '\u60c5\u7eea\u8fc7\u5ea6\u8001\u5e08') {
                                avatarSrc = '../ai-image-tool/yangpian/主用户/主用户头像.png';
                            } else if (currentUser && currentUser.avatar) {
                                avatarSrc = currentUser.avatar;
                            }
                            if (avatarSrc) {
                                btn.innerHTML = '<img class="login-avatar" src="' + avatarSrc + '" alt="avatar">';
                            } else {
                                btn.innerHTML = '<span class="login-avatar-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>';
                            }
                            btn.dataset.loggedIn = 'true';
                            btn.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = 'my-profile.html';
                        };
                        } else {
                            btn.textContent = '\u767b\u5f55';
                            delete btn.dataset.loggedIn;
                        }
                    }
                });

            }
        updateLoginUI();
    });
    </script>
