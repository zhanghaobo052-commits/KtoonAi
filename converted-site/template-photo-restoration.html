<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ktoonAi - 老照片修复</title>
    <meta name="description" content="ktoonAi老照片修复 - 上传老照片，一键修复恢复清晰度和细节">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ktoonAi - 老照片修复">
    <meta name="twitter:title" content="ktoonAi - 老照片修复">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <style>
        /* CSS Reset and Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Dark theme colors - matching original project */
            --background: 230 25% 7%;
            --foreground: 220 20% 92%;

            --card: 230 20% 12%;
            --card-foreground: 220 20% 92%;

            --popover: 230 20% 12%;
            --popover-foreground: 220 20% 92%;

            --primary: 190 100% 55%;
            --primary-foreground: 230 25% 7%;

            --secondary: 320 80% 60%;
            --secondary-foreground: 220 20% 95%;

            --muted: 230 15% 18%;
            --muted-foreground: 220 10% 55%;

            --accent: 270 60% 55%;
            --accent-foreground: 220 20% 95%;

            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;

            --border: 230 15% 20%;
            --input: 230 15% 20%;
            --ring: 190 100% 55%;

            --radius: 0.5rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: hsl(var(--background) / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(var(--border));
        }

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 1.5rem;
            height: 1.5rem;
            fill: url(#logo-gradient);
        }

        .logo-text {
            font-family: 'Display', sans-serif;
            font-size: 1.125rem;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: none;
            align-items: center;
            gap: 2rem;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
        }

        @media (min-width: 768px) {
            .nav-links {
                display: flex;
            }
        }

        .nav-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: hsl(var(--primary));
        }

        .nav-link.active {
            color: hsl(var(--primary));
            font-weight: 500;
        }

        .nav-button {
            display: none;
            align-items: center;
            gap: 0.75rem;
        }

        @media (min-width: 1024px) {
            .nav-button {
                display: flex;
            }
        }

        .btn-primary {
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: hsl(var(--primary-foreground));
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .mobile-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background: none;
            border: none;
            color: hsl(var(--foreground));
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .mobile-toggle {
                display: none;
            }
        }

        .mobile-menu {
            display: none;
            background-color: hsl(var(--background) / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(var(--border));
            padding: 1rem;
        }

        @media (max-width: 767px) {
            .mobile-menu {
                display: block;
            }
        }

        .mobile-menu a {
            display: block;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            text-decoration: none;
        }

        .mobile-menu a:hover {
            color: hsl(var(--primary));
        }

        .mobile-menu .btn-primary {
            width: 100%;
            margin-top: 0.5rem;
        }

        /* Main Content */
        .main-content {
            padding-top: 1.5rem;
            padding-bottom: 4rem;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            color: hsl(var(--muted-foreground));
            font-size: 1.125rem;
        }

        /* Template Card */
        .template-card {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px hsl(var(--background) / 0.3);
        }

        .template-icon {
            width: 3rem;
            height: 3rem;
            color: hsl(var(--primary));
            margin-bottom: 1rem;
        }

        .template-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .template-description {
            color: hsl(var(--muted-foreground));
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* Image Upload Area */
        .image-upload-area {
            width: 100%;
            border: 2px dashed hsl(var(--border));
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .image-upload-area:hover {
            border-color: hsl(var(--primary));
            background-color: hsl(var(--primary) / 0.05);
        }

        .upload-placeholder-icon {
            font-size: 2.5rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: 0.5rem;
        }

        .upload-placeholder-text {
            font-size: 1rem;
            font-weight: 500;
            color: hsl(var(--foreground));
            margin-bottom: 0.25rem;
        }

        .upload-placeholder-hint {
            font-size: 0.8rem;
            color: hsl(var(--muted-foreground));
        }

        .image-preview-container {
            width: 100%;
            position: relative;
        }

        .image-preview-container img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid hsl(var(--border));
        }

        .remove-preview {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .remove-preview:hover { background: rgba(0,0,0,0.8); }

        .template-button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: hsl(var(--primary-foreground));
            border: none;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .template-button:hover {
            opacity: 0.9;
        }

        .template-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Back Button */
        .back-button {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: hsl(var(--muted));
            color: hsl(var(--muted-foreground));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .back-button:hover {
            background-color: hsl(var(--muted) / 0.8);
            color: hsl(var(--foreground));
        }

        /* Result Section */
        .result-section {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        .result-placeholder {
            width: 100%;
            height: 300px;
            background-color: hsl(var(--muted));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsl(var(--muted-foreground));
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid hsl(var(--muted));
            border-radius: 50%;
            border-top-color: hsl(var(--primary));
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            background-color: hsl(var(--card));
            border-top: 1px solid hsl(var(--border));
            padding: 2rem 0;
            text-align: center;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }
    
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            background-color: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 12px hsl(var(--foreground) / 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 4px solid hsl(var(--primary)); }
        .toast-error { border-left: 4px solid hsl(var(--destructive)); }
        .toast-icon { width: 1.25rem; height: 1.25rem; }
        .toast-message { font-size: 0.875rem; color: hsl(var(--foreground)); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-modal.active { opacity: 1; visibility: visible; }
        .login-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .login-modal-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .login-modal-logo svg { width: 28px; height: 28px; }
        .login-modal-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-modal-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .login-modal-field { margin-bottom: 18px; }
        .login-modal-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-modal-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .login-modal-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .login-modal-password { position: relative; }
        .login-modal-password input { padding-right: 44px; }
        .login-modal-eye {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .login-modal-eye:hover { color: hsl(var(--foreground)); }
        .login-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-modal-submit:hover { opacity: 0.9; }
        .login-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-modal-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .login-modal-footer a:hover { opacity: 0.8; }
        .login-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .login-modal-close:hover { color: hsl(var(--foreground)); }

    
        /* Login Avatar */
        .login-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .login-avatar:hover { transform: scale(1.08); }

    
        /* 登录后头像按钮去掉方框 */
        .btn-primary[data-logged-in="true"] {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .btn-primary[data-logged-in="true"]:hover {
            transform: scale(1.08);
        }
    
        .login-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: hsl(var(--muted));
            border: 1px solid hsl(var(--border));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-avatar-placeholder:hover { transform: scale(1.08); }
        .login-avatar-placeholder svg {
            width: 18px;
            height: 18px;
            color: hsl(var(--muted-foreground));
        }
    </style>
</head>
<body>
    <!-- Navbar -->

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">老照片修复</h1>
            <p class="page-subtitle">上传老照片，一键修复恢复清晰度和细节</p>
        </div>

        <!-- Template Card -->
        <div class="template-card" id="photo-restoration-card">
            <svg class="template-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>

            <!-- 图片上传区域 -->
            <div class="image-upload-area" id="photo-upload-area" onclick="document.getElementById('photo-upload').click()">
                <div class="upload-placeholder-icon">+</div>
                <div class="upload-placeholder-text">点击上传老照片</div>
                <div class="upload-placeholder-hint">支持 JPG, PNG 格式</div>
                <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
            </div>

            <!-- 图片预览 -->
            <div class="image-preview-container" id="photo-preview-container" style="display: none;">
                <img id="photo-preview-image" src="" alt="预览">
                <button class="remove-preview" onclick="removePhoto()">&times;</button>
            </div>

            <button class="template-button" onclick="generatePhotoRestoration()" id="photo-restore-btn" disabled>
                开始修复 <span style="font-size:0.75rem;opacity:0.8;">(-2积分)</span>
            </button>

            <!-- 返回按钮 -->
            <a href="javascript:void(0)" class="back-button" onclick="window.parent.backToTemplates()">
                返回模板列表
            </a>
        </div>

        <!-- Result Section -->
        <div class="result-section hidden" id="result-section">
            <h3 class="result-title">生成结果</h3>
            <div class="result-placeholder" id="result-placeholder">
                <div class="loading"></div>
            </div>
            <img class="result-image hidden" id="result-image" src="" alt="生成结果">
            <p class="mt-4" id="result-status"></p>
        </div>
    </main>

    <!-- Footer -->

    <script src="../ai-image-tool/js/points.js"></script>
    <script>
        // API Configuration
        const API_CONFIG = {
            'doubao-4.0-i2i': {
                type: 'image-to-image',
                model: 'doubao-4.0-i2i',
                multiImage: false
            }
        };

        // 提示词配置
        const PROMPT_CONFIG = {
            photoRestoration: '老照片修复，高清修复，无损画质，清晰细节，真实质感，自然肤色，无划痕，无破损，无噪点，无模糊，锐化清晰，光影柔和，年代感，怀旧氛围，8K 超高清，细节丰富，真实自然，人像清晰，五官精致，头发丝清晰'
        };

        // 图片文件存储
        let photoFile = null;

        // 显示结果区域
        function showResult() {
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        // 更新状态
        function updateStatus(message) {
            document.getElementById('result-status').textContent = message;
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('result-placeholder').classList.remove('hidden');
            document.getElementById('result-image').classList.add('hidden');
            updateStatus('正在生成中，请稍候...');
        }

        // 显示结果图片
        function showResultImage(imageUrl) {
            document.getElementById('result-placeholder').classList.add('hidden');
            const resultImage = document.getElementById('result-image');
            resultImage.src = imageUrl;
            resultImage.classList.remove('hidden');
            updateStatus('生成完成！');
        }

        // 处理老照片上传
        function handlePhotoUpload(event) {
            var file = event.target.files[0];
            if (!file) return;
            photoFile = file;

            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview-image').src = e.target.result;
                document.getElementById('photo-preview-container').style.display = 'block';
                document.getElementById('photo-upload-area').style.display = 'none';
                document.getElementById('photo-restore-btn').disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // 移除老照片
        function removePhoto() {
            photoFile = null;
            document.getElementById('photo-upload').value = '';
            document.getElementById('photo-preview-container').style.display = 'none';
            document.getElementById('photo-upload-area').style.display = '';
            document.getElementById('photo-restore-btn').disabled = true;
        }

        // 老照片修复
        async function generatePhotoRestoration() {
            if (!photoFile) {
                alert('请先上传老照片');
                return;
            }

            // 积分检查
            if (window.KtoonPoints) {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                if (!loggedIn) {
                    alert('请先登录');
                    return;
                }
                var result = window.KtoonPoints.deduct('template');
                if (!result.ok) {
                    alert('积分不足，老照片修复需要 2 积分，当前剩余 ' + result.remaining + ' 积分');
                    return;
                }
                if (window.parent && window.parent.refreshPointsDisplay) {
                    window.parent.refreshPointsDisplay();
                }
            }

            showResult();
            showLoading();

            try {
                const response = await callImageAPI(PROMPT_CONFIG.photoRestoration, photoFile);
                showResultImage(response.imageUrl);
            } catch (error) {
                updateStatus('生成失败：' + error.message);
                if (window.KtoonPoints) {
                    KtoonPoints.refund('template');
                    if (window.parent && window.parent.refreshPointsDisplay) window.parent.refreshPointsDisplay();
                }
            }
        }

        // 调用图像API的通用函数
        async function callImageAPI(prompt, imageFile) {
            const config = API_CONFIG['doubao-4.0-i2i'];

            try {
                let requestData;

                if (imageFile) {
                    // 图生图模式
                    const base64Image = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(imageFile);
                    });

                    requestData = {
                        model: config.model,
                        prompt: prompt,
                        response_format: "url",
                        image: base64Image
                    };
                }

                console.log('请求数据:', requestData);

                // 使用代理服务器避免 CORS 问题
                const proxyResponse = await fetch('/api-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: config.model,
                        data: requestData
                    })
                });

                if (!proxyResponse.ok) {
                    const errorText = await proxyResponse.text();
                    throw new Error(`代理请求失败: ${proxyResponse.status} - ${errorText}`);
                }

                const data = await proxyResponse.json();
                console.log('API 响应数据:', data);

                // 处理响应
                let imageUrl;
                if (data.data && data.data[0] && data.data[0].url) {
                    imageUrl = data.data[0].url;
                } else if (data.url) {
                    imageUrl = data.url;
                } else if (data.data && Array.isArray(data.data) && data.data[0]) {
                    imageUrl = data.data[0];
                } else {
                    throw new Error('无法从响应中获取图片 URL');
                }

                return { imageUrl };
            } catch (error) {
                console.error('API调用错误:', error);
                throw error;
            }
        }
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toast notification system
        function showToast(message, type) {
            type = type || 'success';
            var container = document.querySelector('.toast-container') || createToastContainer();
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icon = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            toast.innerHTML = icon + '<span class="toast-message">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        function createToastContainer() {
            var container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // Login modal
        var loginModal = document.getElementById('loginModal');
        if (!loginModal) return;

        var loginModalClose = document.getElementById('loginModalClose');
        var loginEyeToggle = document.getElementById('loginEyeToggle');
        var loginPassword = document.getElementById('loginPassword');
        var loginSubmit = document.getElementById('loginSubmit');

        function openLoginModal(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            loginModal.classList.add('active');
        }

        function closeLoginModal() {
            loginModal.classList.remove('active');
        }

        // Open modal on login button click
        document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
            if (btn.textContent.trim() === '登录' && btn.id !== 'loginSubmit') {
                btn.addEventListener('click', openLoginModal);
            }
        });

        loginModalClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeLoginModal();
        });

        // Password eye toggle
        loginEyeToggle.addEventListener('click', function() {
            var isPassword = loginPassword.type === 'password';
            loginPassword.type = isPassword ? 'text' : 'password';
            loginEyeToggle.innerHTML = isPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        // Login submit
        loginSubmit.addEventListener('click', function() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = loginPassword.value.trim();
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }

            var validUsers = { '情绪过度老师': '12345678' };
            var stored = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            stored.forEach(function(u) { validUsers[u.username] = u.password; });

            if (validUsers[username] && validUsers[username] === password) {
                localStorage.setItem('ktoon_logged_in', username);
                if (window.KtoonPoints) KtoonPoints.init(username);
                showToast('登录成功！', 'success');
                closeLoginModal();
                updateLoginUI();
            } else {
                showToast('用户名或密码错误', 'error');
            }
        });

        // Update login button UI
        function updateLoginUI() {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
                var currentUser = null;
                if (loggedIn) {
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].username === loggedIn) { currentUser = users[i]; break; }
                    }
                }
                document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
                    if ((btn.textContent.trim() === '\u767b\u5f55' || btn.dataset.loggedIn === 'true') && btn.id !== 'loginSubmit') {
                        if (loggedIn) {
                            var avatarSrc = null;
                            if (loggedIn === '\u60c5\u7eea\u8fc7\u5ea6\u8001\u5e08') {
                                avatarSrc = '../ai-image-tool/yangpian/主用户/主用户头像.png';
                            } else if (currentUser && currentUser.avatar) {
                                avatarSrc = currentUser.avatar;
                            }
                            if (avatarSrc) {
                                btn.innerHTML = '<img class="login-avatar" src="' + avatarSrc + '" alt="avatar">';
                            } else {
                                btn.innerHTML = '<span class="login-avatar-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>';
                            }
                            btn.dataset.loggedIn = 'true';
                            btn.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = 'my-profile.html';
                        };
                        } else {
                            btn.textContent = '\u767b\u5f55';
                            delete btn.dataset.loggedIn;
                        }
                    }
                });

            }
        updateLoginUI();
    });
    </script>
