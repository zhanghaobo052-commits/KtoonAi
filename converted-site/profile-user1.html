<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画梦者 - ktoonAi</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: 230 25% 7%; --fg: 220 20% 92%; --card: 230 20% 12%;
            --border: 230 15% 20%; --muted: 220 10% 55%; --primary: 190 100% 55%;
            --primary-fg: 230 25% 7%; --radius: 0.75rem;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: hsl(var(--bg)); color: hsl(var(--fg)); min-height: 100vh;
        }
        /* Navbar */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            border-bottom: 1px solid hsl(var(--border) / 0.5);
            background-color: hsl(var(--bg) / 0.6); backdrop-filter: blur(12px);
        }
        .navbar-container {
            max-width: 1280px; margin: 0 auto; padding: 0 1rem;
            height: 4rem; display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 0.5rem;
            text-decoration: none; color: inherit;
        }
        .logo-icon { width: 1.5rem; height: 1.5rem; }
        .logo-text {
            font-size: 1.125rem; font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-button { display: none; align-items: center; gap: 0.75rem; }
        @media (min-width: 1024px) { .nav-button { display: flex; } }
        .btn-primary {
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: hsl(var(--primary-fg)); border: none; padding: 0.5rem 1rem;
            border-radius: var(--radius); font-size: 0.875rem; font-weight: 500; cursor: pointer;
        }
        .mobile-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 2.5rem; height: 2.5rem; background: none; border: none;
            color: hsl(var(--fg)); cursor: pointer;
        }
        @media (min-width: 768px) { .mobile-toggle { display: none; } }

        /* Profile Header */
        .profile-header {
            max-width: 900px; margin: 0 auto; padding: 80px 2rem 2rem;
            display: flex; align-items: center; gap: 24px;
        }
        .profile-avatar {
            width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
            border: 3px solid hsl(var(--border)); flex-shrink: 0;
        }
        .profile-info { flex: 1; }
        .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .profile-bio { font-size: 13px; color: hsl(var(--muted)); margin-bottom: 10px; }
        .profile-stats {
            display: flex; gap: 20px; font-size: 13px; color: hsl(var(--muted));
        }
        .profile-stats span { color: hsl(var(--fg)); font-weight: 600; }
        .follow-btn { padding: 6px 24px; border-radius: 20px; border: 1px solid hsl(var(--primary)); background: transparent; color: hsl(var(--primary)); font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .follow-btn:hover { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
        .follow-btn.followed { background: hsl(var(--muted)); border-color: hsl(var(--border)); color: hsl(var(--muted-foreground)); }
        .follow-btn.followed:hover { background: hsl(var(--destructive) / 0.1); border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); }

        /* Tabs */
        .profile-tabs {
            max-width: 900px; margin: 0 auto; padding: 0 2rem;
            display: flex; gap: 24px; border-bottom: 1px solid var(--border);
        }
        .profile-tab {
            padding: 12px 0; font-size: 14px; color: var(--muted);
            cursor: pointer; border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .profile-tab.active {
            color: var(--fg); border-bottom-color: var(--primary);
        }

        /* Gallery */
        .gallery {
            max-width: 900px; margin: 0 auto; padding: 1.5rem 2rem 4rem;
            column-count: 3; column-gap: 0.75rem;
        }
        @media (max-width: 768px) { .gallery { column-count: 2; } }
        @media (max-width: 480px) { .gallery { column-count: 2; padding: 1rem; } }

        .work-card {
            background: var(--card); border-radius: var(--radius);
            overflow: hidden; border: 1px solid var(--border);
            cursor: pointer; break-inside: avoid; margin-bottom: 0.75rem;
            transition: transform 0.2s;
        }
        .work-card:hover { transform: translateY(-2px); }
        .work-card img { width: 100%; display: block; }
        .work-card .work-info { padding: 8px 10px; }
        .work-card .work-title {
            font-size: 12px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .work-card .work-likes {
            font-size: 11px; color: #777; display: flex; align-items: center;
            gap: 3px; margin-top: 3px;
        }

        /* Modal */
        .modal {
            position: fixed; inset: 0; z-index: 999; display: none;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            display: flex; width: 90vw; max-width: 1000px;
            max-height: 90vh; background: var(--card); border-radius: 12px;
            overflow: hidden; position: relative;
        }
        .modal-image-wrap {
            flex: 1 1 60%; display: flex; align-items: center;
            justify-content: center; background: #111; min-height: 300px;
        }
        .modal-image { max-width: 100%; max-height: 85vh; object-fit: contain; }
        .modal-info {
            flex: 1 1 40%; display: flex; flex-direction: column;
            overflow: hidden; min-width: 280px;
        }
        .modal-close {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: none; color: #fff;
            font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .modal-prompt-section {
            flex: 1; padding: 16px 20px; overflow-y: auto;
        }
        .modal-prompt-label {
            font-size: 12px; color: var(--muted); margin-bottom: 8px;
            display: flex; align-items: center; gap: 4px;
        }
        .modal-prompt-text {
            font-size: 13px; line-height: 1.7; color: var(--fg);
            word-break: break-all;
        }
        .modal-action-bar {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .modal-action-btn {
            display: flex; align-items: center; gap: 4px;
            background: none; border: none; color: var(--muted);
            font-size: 13px; cursor: pointer; padding: 4px 8px;
            border-radius: 6px; transition: color 0.2s, background 0.2s;
        }
        .modal-action-btn:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
        .modal-action-btn.liked { color: #ff4757; }
        .modal-action-btn.liked svg { fill: #ff4757; stroke: #ff4757; }
        .modal-action-btn svg { width: 16px; height: 16px; }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-image-wrap { max-height: 50vh; }
            .modal-info { min-width: unset; }
            .profile-header { flex-direction: column; text-align: center; }
            .profile-stats { justify-content: center; }
        }
    
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            background-color: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 12px hsl(var(--foreground) / 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 4px solid hsl(var(--primary)); }
        .toast-error { border-left: 4px solid hsl(var(--destructive)); }
        .toast-icon { width: 1.25rem; height: 1.25rem; }
        .toast-message { font-size: 0.875rem; color: hsl(var(--foreground)); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-modal.active { opacity: 1; visibility: visible; }
        .login-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .login-modal-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .login-modal-logo svg { width: 28px; height: 28px; }
        .login-modal-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-modal-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .login-modal-field { margin-bottom: 18px; }
        .login-modal-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-modal-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .login-modal-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .login-modal-password { position: relative; }
        .login-modal-password input { padding-right: 44px; }
        .login-modal-eye {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .login-modal-eye:hover { color: hsl(var(--foreground)); }
        .login-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-modal-submit:hover { opacity: 0.9; }
        .login-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-modal-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .login-modal-footer a:hover { opacity: 0.8; }
        .login-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .login-modal-close:hover { color: hsl(var(--foreground)); }

    
        /* Login Avatar */
        .login-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .login-avatar:hover { transform: scale(1.08); }

    
        /* 登录后头像按钮去掉方框 */
        .btn-primary[data-logged-in="true"] {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .btn-primary[data-logged-in="true"]:hover {
            transform: scale(1.08);
        }
    
        .login-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: hsl(var(--muted));
            border: 1px solid hsl(var(--border));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-avatar-placeholder:hover { transform: scale(1.08); }
        .login-avatar-placeholder svg {
            width: 18px;
            height: 18px;
            color: hsl(var(--muted-foreground));
        }

        .confirm-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .confirm-box { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 24px; width: 320px; max-width: 90vw; }
        .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: hsl(var(--fg)); }
        .confirm-msg { font-size: 14px; color: hsl(var(--muted-fg)); margin-bottom: 20px; }
        .confirm-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .confirm-cancel { padding: 6px 20px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--fg)); font-size: 14px; cursor: pointer; }
        .confirm-cancel:hover { background: hsl(var(--muted)); }
        .confirm-ok { padding: 6px 20px; border-radius: 8px; border: none; background: hsl(var(--destructive)); color: #fff; font-size: 14px; cursor: pointer; }
        .confirm-ok:hover { opacity: 0.9; }
    </style>
</head>

                <span class="login-modal-logo-text">Ktoonai</span>
            </div>
            <div class="login-modal-title">欢迎登录Ktoonai</div>
            <div class="login-modal-field">
                <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="login-modal-field login-modal-password">
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                <button class="login-modal-eye" id="loginEyeToggle" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button class="login-modal-submit" id="loginSubmit">登录</button>
            <div class="login-modal-footer">
                <a href="forgot-password.html">忘记密码?</a>
                <a href="register.html">没有账号?</a>
            </div>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toast notification system
        function showToast(message, type) {
            type = type || 'success';
            var container = document.querySelector('.toast-container') || createToastContainer();
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icon = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            toast.innerHTML = icon + '<span class="toast-message">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        function createToastContainer() {
            var container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // Login modal
        var loginModal = document.getElementById('loginModal');
        if (!loginModal) return;

        var loginModalClose = document.getElementById('loginModalClose');
        var loginEyeToggle = document.getElementById('loginEyeToggle');
        var loginPassword = document.getElementById('loginPassword');
        var loginSubmit = document.getElementById('loginSubmit');

        function openLoginModal(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            loginModal.classList.add('active');
        }

        function closeLoginModal() {
            loginModal.classList.remove('active');
        }

        // Open modal on login button click
        document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
            if (btn.textContent.trim() === '登录' && btn.id !== 'loginSubmit') {
                btn.addEventListener('click', openLoginModal);
            }
        });

        loginModalClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeLoginModal();
        });

        // Password eye toggle
        loginEyeToggle.addEventListener('click', function() {
            var isPassword = loginPassword.type === 'password';
            loginPassword.type = isPassword ? 'text' : 'password';
            loginEyeToggle.innerHTML = isPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        // Login submit
        loginSubmit.addEventListener('click', function() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = loginPassword.value.trim();
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }

            var validUsers = { '情绪过度老师': '12345678' };
            var stored = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            stored.forEach(function(u) { validUsers[u.username] = u.password; });

            if (validUsers[username] && validUsers[username] === password) {
                localStorage.setItem('ktoon_logged_in', username);
                showToast('登录成功！', 'success');
                closeLoginModal();
                updateLoginUI();
            } else {
                showToast('用户名或密码错误', 'error');
            }
        });

        // Update login button UI
        function updateLoginUI() {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
                var currentUser = null;
                if (loggedIn) {
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].username === loggedIn) { currentUser = users[i]; break; }
                    }
                }
                document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
                    if ((btn.textContent.trim() === '\u767b\u5f55' || btn.dataset.loggedIn === 'true') && btn.id !== 'loginSubmit') {
                        if (loggedIn) {
                            var avatarSrc = null;
                            if (loggedIn === '\u60c5\u7eea\u8fc7\u5ea6\u8001\u5e08') {
                                avatarSrc = 'https://ktoonai-1425689077.cos.ap-beijing.myqcloud.com/主用户/主用户头像.png';
                            } else if (currentUser && currentUser.avatar) {
                                avatarSrc = currentUser.avatar;
                            }
                            if (avatarSrc) {
                                btn.innerHTML = '<img class="login-avatar" src="' + avatarSrc + '" alt="avatar">';
                            } else {
                                btn.innerHTML = '<span class="login-avatar-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>';
                            }
                            btn.dataset.loggedIn = 'true';
                            btn.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = 'my-profile.html';
                        };
                        } else {
                            btn.textContent = '\u767b\u5f55';
                            delete btn.dataset.loggedIn;
                        }
                    }
                });

            }
        updateLoginUI();
    });
    </script>
