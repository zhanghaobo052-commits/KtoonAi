<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - ktoonAi</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --background: 230 25% 7%;
            --foreground: 220 20% 92%;
            --card: 230 20% 12%;
            --primary: 190 100% 55%;
            --primary-foreground: 230 25% 7%;
            --muted: 230 15% 18%;
            --muted-foreground: 220 10% 55%;
            --border: 230 15% 20%;
            --radius: 0.75rem;
            --destructive: 0 84.2% 60.2%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: hsl(var(--background) / 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(var(--border) / 0.4);
        }
        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: hsl(var(--foreground));
        }
        .logo-icon { width: 28px; height: 28px; }
        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, hsl(var(--primary)), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: none;
            gap: 0.25rem;
        }
        @media (min-width: 768px) { .nav-links { display: flex; } }
        .nav-link {
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-link:hover { color: hsl(var(--foreground)); }
        .nav-button { display: flex; }
        .btn-primary {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            background-color: hsl(var(--primary));
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            color: hsl(var(--primary-foreground));
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { transform: scale(1.05); }
        .mobile-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            background: transparent;
            color: hsl(var(--foreground));
            cursor: pointer;
        }
        @media (min-width: 768px) { .mobile-toggle { display: none; } }
        .mobile-menu {
            padding: 0.75rem 1rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid hsl(var(--border));
        }
        .mobile-menu a {
            padding: 0.75rem;
            border-radius: var(--radius);
            color: hsl(var(--foreground));
            text-decoration: none;
        }
        .mobile-menu a:hover { background: hsl(var(--muted)); }
        .mobile-menu .btn-primary { width: 100%; text-align: center; }

        /* Auth Page Layout */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 1rem 2rem;
        }
        .auth-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
        }
        .auth-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .auth-logo svg { width: 28px; height: 28px; }
        .auth-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .auth-field { margin-bottom: 18px; }
        .auth-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .auth-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .auth-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .auth-password { position: relative; }
        .auth-password input { padding-right: 44px; }
        .auth-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .auth-eye:hover { color: hsl(var(--foreground)); }
        .auth-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .auth-submit:hover { opacity: 0.9; }
        .auth-footer {
            display: flex;
            justify-content: center;
            margin-top: 18px;
            font-size: 13px;
            gap: 4px;
        }
        .auth-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .auth-footer a:hover { opacity: 0.8; }
        .auth-error {
            color: hsl(var(--destructive));
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 14px;
            display: none;
        }
        .auth-error.show { display: block; }
    
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            background-color: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 12px hsl(var(--foreground) / 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 4px solid hsl(var(--primary)); }
        .toast-error { border-left: 4px solid hsl(var(--destructive)); }
        .toast-icon { width: 1.25rem; height: 1.25rem; }
        .toast-message { font-size: 0.875rem; color: hsl(var(--foreground)); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-modal.active { opacity: 1; visibility: visible; }
        .login-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            padding: 40px 36px 32px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .login-modal-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .login-modal-logo svg { width: 28px; height: 28px; }
        .login-modal-logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-modal-title {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 28px;
        }
        .login-modal-field { margin-bottom: 18px; }
        .login-modal-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-modal-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .login-modal-field input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
        .login-modal-password { position: relative; }
        .login-modal-password input { padding-right: 44px; }
        .login-modal-eye {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .login-modal-eye:hover { color: hsl(var(--foreground)); }
        .login-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-modal-submit:hover { opacity: 0.9; }
        .login-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-modal-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .login-modal-footer a:hover { opacity: 0.8; }
        .login-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .login-modal-close:hover { color: hsl(var(--foreground)); }

    
        /* Login Avatar */
        .login-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid hsl(var(--primary));
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .login-avatar:hover { transform: scale(1.08); }

        /* Profile Edit Modal */
        .profile-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .profile-modal.active { opacity: 1; visibility: visible; }
        .profile-modal-box {
            background: hsl(var(--card));
            border-radius: 16px;
            width: 420px;
            max-width: 92vw;
            padding: 36px 32px 28px;
            border: 1px solid hsl(var(--border));
            position: relative;
        }
        .profile-modal-close {
            position: absolute;
            top: 14px; right: 14px;
            background: none; border: none;
            color: hsl(var(--muted-foreground));
            font-size: 20px;
            cursor: pointer; padding: 4px;
            line-height: 1;
        }
        .profile-modal-close:hover { color: hsl(var(--foreground)); }
        .profile-modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .profile-modal-subtitle {
            font-size: 13px;
            color: hsl(var(--muted-foreground));
            margin-bottom: 24px;
        }
        .profile-avatar-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }
        .profile-avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
        }
        .profile-avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: hsl(var(--muted));
            border: 2px dashed hsl(var(--border));
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .profile-avatar-wrapper:hover .profile-avatar-placeholder {
            border-color: hsl(var(--primary));
        }
        .profile-avatar-placeholder svg {
            width: 28px;
            height: 28px;
            color: hsl(var(--muted-foreground));
        }
        .profile-avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid hsl(var(--primary) / 0.5);
        }
        .profile-avatar-hint {
            font-size: 12px;
            color: hsl(var(--muted-foreground));
            margin-top: 8px;
        }
        .profile-field {
            margin-bottom: 16px;
        }
        .profile-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
            margin-bottom: 6px;
        }
        .profile-field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            transition: all 0.2s;
        }
        .profile-field input:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--primary) / 0.2);
        }
        .profile-field input::placeholder { color: hsl(var(--muted-foreground) / 0.5); }
        .profile-field-row {
            display: flex;
            gap: 12px;
        }
        .profile-field-row .profile-field { flex: 1; }
        .profile-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, hsl(var(--primary)) 0%, #8b5cf6 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .profile-submit:hover { opacity: 0.9; }
        .profile-skip {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: hsl(var(--muted-foreground));
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
        }
        .profile-skip:hover { color: hsl(var(--foreground)); }

    
        /* 登录后头像按钮去掉方框 */
        .btn-primary[data-logged-in="true"] {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .btn-primary[data-logged-in="true"]:hover {
            transform: scale(1.08);
        }
    
        .login-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: hsl(var(--muted));
            border: 1px solid hsl(var(--border));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-avatar-placeholder:hover { transform: scale(1.08); }
        .login-avatar-placeholder svg {
            width: 18px;
            height: 18px;
            color: hsl(var(--muted-foreground));
        }
    </style>
</head>

    <script>
        // Mobile menu
        document.getElementById('mobileToggle').addEventListener('click', () => {
            const m = document.getElementById('mobileMenu');
            m.style.display = m.style.display === 'none' ? 'flex' : 'none';
        });

        // Eye toggles
        function setupEyeToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            btn.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.innerHTML = show
                    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            });
        }
        setupEyeToggle('regEyeToggle', 'regPassword');
        setupEyeToggle('regEyeToggle2', 'regPasswordConfirm');

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
        }
        function hideError(id) {
            document.getElementById(id).classList.remove('show');
        }

        // Register
        document.getElementById('regSubmit').addEventListener('click', () => {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;

            hideError('regUsernameError');
            hideError('regEmailError');
            hideError('regPasswordError');

            let valid = true;

            if (!username) { showError('regUsernameError', '请输入用户名'); valid = false; }
            else if (username.length < 3) { showError('regUsernameError', '用户名至少3个字符'); valid = false; }

            if (!email) { showError('regEmailError', '请输入邮箱'); valid = false; }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('regEmailError', '邮箱格式不正确'); valid = false; }

            if (!password) { showError('regPasswordError', '请输入密码'); valid = false; }
            else if (password.length < 6) { showError('regPasswordError', '密码至少6位'); valid = false; }
            else if (password !== confirm) { showError('regPasswordError', '两次密码不一致'); valid = false; }

            if (!valid) return;

            // Check if username is taken
            if (username === '情绪过度老师') { showError('regUsernameError', '该用户名已存在'); return; }

            const users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            if (users.find(u => u.username === username)) { showError('regUsernameError', '该用户名已存在'); return; }

            users.push({ username, email, password, phone: '', avatar: '' });
            localStorage.setItem('ktoon_users', JSON.stringify(users));

            // 初始化积分
            var allPoints = JSON.parse(localStorage.getItem('ktoonai_points') || '{}');
            allPoints[username] = 200;
            localStorage.setItem('ktoonai_points', JSON.stringify(allPoints));

            // Auto login
            localStorage.setItem('ktoon_logged_in', username);

            // Show profile edit modal
            openProfileModal(username, email);
        });
    </script>

    <script>
    // Toast notification system (global scope so all code can use it)
    function showToast(message, type) {
        type = type || 'success';
        var container = document.querySelector('.toast-container') || createToastContainer();
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        var icon = type === 'success'
            ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        toast.innerHTML = icon + '<span class="toast-message">' + message + '</span>';
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }

    function createToastContainer() {
        var container = document.createElement('div');
        container.className = 'toast-container';
        document.body.appendChild(container);
        return container;
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Login modal
        var loginModal = document.getElementById('loginModal');
        if (!loginModal) return;

        var loginModalClose = document.getElementById('loginModalClose');
        var loginEyeToggle = document.getElementById('loginEyeToggle');
        var loginPassword = document.getElementById('loginPassword');
        var loginSubmit = document.getElementById('loginSubmit');

        function openLoginModal(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            loginModal.classList.add('active');
        }

        function closeLoginModal() {
            loginModal.classList.remove('active');
        }

        // Open modal on login button click
        document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
            if (btn.textContent.trim() === '登录' && btn.id !== 'loginSubmit') {
                btn.addEventListener('click', openLoginModal);
            }
        });

        loginModalClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeLoginModal();
        });

        // Password eye toggle
        loginEyeToggle.addEventListener('click', function() {
            var isPassword = loginPassword.type === 'password';
            loginPassword.type = isPassword ? 'text' : 'password';
            loginEyeToggle.innerHTML = isPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        // Login submit
        loginSubmit.addEventListener('click', function() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = loginPassword.value.trim();
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }

            var validUsers = { '情绪过度老师': '12345678' };
            var stored = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            stored.forEach(function(u) { validUsers[u.username] = u.password; });

            if (validUsers[username] && validUsers[username] === password) {
                localStorage.setItem('ktoon_logged_in', username);
                // 确保老用户也有积分
                if (window.KtoonPoints) {
                    window.KtoonPoints.init(username);
                }
                showToast('登录成功！', 'success');
                closeLoginModal();
                updateLoginUI();
            } else {
                showToast('用户名或密码错误', 'error');
            }
        });

        // Update login button UI
        function updateLoginUI() {
                var loggedIn = localStorage.getItem('ktoon_logged_in');
                var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
                var currentUser = null;
                if (loggedIn) {
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].username === loggedIn) { currentUser = users[i]; break; }
                    }
                }
                document.querySelectorAll('.btn-primary, .nav-btn, [class*="login"], a').forEach(function(btn) {
                    if ((btn.textContent.trim() === '\u767b\u5f55' || btn.dataset.loggedIn === 'true') && btn.id !== 'loginSubmit') {
                        if (loggedIn) {
                            var avatarSrc = null;
                            if (loggedIn === '\u60c5\u7eea\u8fc7\u5ea6\u8001\u5e08') {
                                avatarSrc = 'https://ktoonai-1425689077.cos.ap-beijing.myqcloud.com/主用户/主用户头像.png';
                            } else if (currentUser && currentUser.avatar) {
                                avatarSrc = currentUser.avatar;
                            }
                            if (avatarSrc) {
                                btn.innerHTML = '<img class="login-avatar" src="' + avatarSrc + '" alt="avatar">';
                            } else {
                                btn.innerHTML = '<span class="login-avatar-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>';
                            }
                            btn.dataset.loggedIn = 'true';
                            btn.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = 'my-profile.html';
                        };
                        } else {
                            btn.textContent = '\u767b\u5f55';
                            delete btn.dataset.loggedIn;
                        }
                    }
                });

            }
        updateLoginUI();
    });

    // Profile Edit Modal (outside DOMContentLoaded so registration handler can call it)
    var profileModal = document.getElementById('profileModal');
    var profileAvatarInput = document.getElementById('profileAvatarInput');
    var profileAvatarWrapper = document.getElementById('profileAvatarWrapper');
    var profileAvatarPlaceholder = document.getElementById('profileAvatarPlaceholder');
    var avatarData = '';

    function openProfileModal(username, email) {
            document.getElementById('profileUsername').value = username || '';
            document.getElementById('profileEmail').value = email || '';
            document.getElementById('profilePhone').value = '';
            avatarData = '';
            // Reset avatar to placeholder
            var existing = profileAvatarWrapper.querySelector('.profile-avatar-img');
            if (existing) existing.remove();
            profileAvatarPlaceholder.style.display = 'flex';
            profileModal.classList.add('active');
        }

        function closeProfileModal() {
            profileModal.classList.remove('active');
        }

        document.getElementById('profileModalClose').addEventListener('click', function() {
            closeProfileModal();
            window.location.href = 'index-converted.html';
        });

        // Click avatar wrapper to trigger file input
        profileAvatarWrapper.addEventListener('click', function() {
            profileAvatarInput.click();
        });

        profileAvatarInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                avatarData = ev.target.result;
                // Show preview
                var existing = profileAvatarWrapper.querySelector('.profile-avatar-img');
                if (existing) existing.remove();
                profileAvatarPlaceholder.style.display = 'none';
                var img = document.createElement('img');
                img.className = 'profile-avatar-img';
                img.src = avatarData;
                profileAvatarWrapper.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        // Save profile
        document.getElementById('profileSubmit').addEventListener('click', function() {
            var username = document.getElementById('profileUsername').value.trim();
            var email = document.getElementById('profileEmail').value.trim();
            var phone = document.getElementById('profilePhone').value.trim();

            if (!username || username.length < 3) {
                showToast('用户名至少3个字符', 'error');
                return;
            }
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('邮箱格式不正确', 'error');
                return;
            }
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                showToast('手机号格式不正确', 'error');
                return;
            }

            // Update user data in localStorage
            var loggedIn = localStorage.getItem('ktoon_logged_in');
            var users = JSON.parse(localStorage.getItem('ktoon_users') || '[]');
            var idx = users.findIndex(function(u) { return u.username === loggedIn; });
            if (idx !== -1) {
                users[idx].username = username;
                users[idx].email = email;
                users[idx].phone = phone;
                if (avatarData) users[idx].avatar = avatarData;
                localStorage.setItem('ktoon_users', JSON.stringify(users));
                localStorage.setItem('ktoon_logged_in', username);
            }

            showToast('资料保存成功！', 'success');
            closeProfileModal();
            setTimeout(function() { window.location.href = 'index-converted.html'; }, 800);
        });

        // Skip profile
        document.getElementById('profileSkip').addEventListener('click', function() {
            closeProfileModal();
            window.location.href = 'index-converted.html';
        });
    </script>

</body>
</html>
